upstream pclsguserver_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # SSL certificates - replace with your own
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy API requests
    location /api/ {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy health check
    location /health {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
    }

    # Proxy index.json
    location /index.json {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 5s;
    }

    # Proxy static index.json
    location /static/ {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
    }

    # Admin frontend (SPA)
    location /admin {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Market frontend (SPA) - root path
    location / {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Download endpoints - larger body size for uploads
    location /api/admin/ {
        proxy_pass http://pclsguserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}